<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1524" />
  <title>RecommendME</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f1524;
      color: #f4f6fb;
      font-family: system-ui, sans-serif;
      padding: 2rem;
      text-align: center;
    }
    .logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: linear-gradient(135deg, #df5f50, #aa3529);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      margin-bottom: 1.5rem;
      animation: pulse 2s ease-in-out infinite;
    }
    h1 { font-size: 1.75rem; margin-bottom: 0.5rem; }
    h1 span { color: #df5f50; }
    p { color: #a0b3d7; font-size: 0.9rem; line-height: 1.6; max-width: 280px; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #293a60;
      border-top-color: #df5f50;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-top: 2rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 20px rgba(223, 95, 80, 0.3); }
      50% { box-shadow: 0 0 40px rgba(223, 95, 80, 0.6); }
    }
  </style>
</head>
<body>
  <div class="logo">🎬</div>
  <h1>Recommend<span>ME</span></h1>
  <p>Loading your movie companion...</p>
  <div class="spinner"></div>
  <script>
    // Fallback shell — Capacitor loads CAPACITOR_SERVER_URL when configured
    setTimeout(function() {
      document.querySelector('p').textContent =
        'Set CAPACITOR_SERVER_URL to your server, or deploy and rebuild the APK.';
    }, 5000);
  </script>
</body>
</html>
